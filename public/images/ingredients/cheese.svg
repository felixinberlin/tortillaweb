<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="320" height="240" fill="none" role="img" aria-label="Queso Manchego" class="">


    <defs>
      
    <!-- Master Drop Shadow with Warm Ambient Occlusion -->
    <filter id="cheese_svg_dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" floodColor="#1C0A00" floodOpacity="0.38" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#000000" floodOpacity="0.25" />
    </filter>

    <!-- Deep 3D Shadow for Floating Objects -->
    <filter id="cheese_svg_deepShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" floodColor="#1A0D00" floodOpacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#000000" floodOpacity="0.3" />
    </filter>

    <!-- Soft Organic Shadow -->
    <filter id="cheese_svg_softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3.5" floodColor="#271505" floodOpacity="0.3" />
    </filter>

    <!-- Glossy Specular Highlight Filter -->
    <filter id="cheese_svg_glossHighlight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Food Glisten Filter -->
    <filter id="cheese_svg_glistenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Organic Natural Texture Filter -->
    <filter id="cheese_svg_organicTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.5   0 0 0 0 0.4   0 0 0 0 0.3  0 0 0 0.12 0" />
      <feComposite in2="SourceGraphic" in="gl" operator="in" />
    </filter>
  
      
      <!-- Ivory-Yellow Aged Cheese Paste Face -->
      <linearGradient id="cheese_svg_pasteFace" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stopColor="#FFFBEB" />
        <stop offset="40%" stopColor="#FEF3C7" />
        <stop offset="80%" stopColor="#FDE68A" />
        <stop offset="100%" stopColor="#F59E0B" />
      </linearGradient>

      <!-- Top Paste Surface -->
      <linearGradient id="cheese_svg_pasteTop" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stopColor="#FFFFFF" />
        <stop offset="60%" stopColor="#FEF3C7" />
        <stop offset="100%" stopColor="#FDE68A" />
      </linearGradient>

      <!-- Dark Herringbone Esparto Grass Rind -->
      <linearGradient id="cheese_svg_espartoRind" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stopColor="#78350F" />
        <stop offset="50%" stopColor="#451A03" />
        <stop offset="100%" stopColor="#1C0A00" />
      </linearGradient>

      <radialGradient id="cheese_svg_eye" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stopColor="#D97706" />
        <stop offset="70%" stopColor="#B45309" />
        <stop offset="100%" stopColor="#FEF3C7" stopOpacity="0" />
      </radialGradient>
    </defs>

    <g filter="url(#cheese_svg_dropShadow)">
      <!-- 1. Dark Esparto Rind on Outer Curve -->
      <path d="M 68 28 C 76 34 84 48 84 64 L 74 82 C 74 68 66 56 60 48 Z" fill="url(#cheese_svg_espartoRind)" stroke="#1C0A00" stroke-width="1.2" />
      <!-- Herringbone Zig-zag imprint on rind -->
      <path d="M 68 32 L 72 35 L 68 38 L 72 41 L 68 44 L 72 47 L 68 50 L 72 53" stroke="#92400E" stroke-width="1" fill="none" />

      <!-- 2. Main Cut Face (Cross-Section) -->
      <polygon points="20,68 60,48 74,82 20,86" fill="url(#cheese_svg_pasteFace)" stroke="#D97706" stroke-width="1.2" />

      <!-- 3. Top Triangular Face -->
      <polygon points="20,68 60,48 68,28 20,68" fill="url(#cheese_svg_pasteTop)" stroke="#CA8A04" stroke-width="1.2" />

      <!-- 4. Tiny Natural Fermentation Eyes (Eyes / Ojos del queso) -->
      <ellipse cx="38" cy="72" rx="3.5" ry="2.2" fill="url(#cheese_svg_eye)" transform="rotate(-10 38 72)" />
      <ellipse cx="54" cy="65" rx="3" ry="1.8" fill="url(#cheese_svg_eye)" transform="rotate(15 54 65)" />
      <ellipse cx="46" cy="80" rx="2.5" ry="1.5" fill="url(#cheese_svg_eye)" />
      <ellipse cx="30" cy="78" rx="2" ry="1.2" fill="url(#cheese_svg_eye)" />

      <!-- 5. Butterfat Perspiration Droplets (Oleic sweat of aged cheese) -->
      <circle cx="34" cy="70" r="1" fill="#FFFFFF" opacity="0.9" />
      <circle cx="48" cy="62" r="1.1" fill="#FFFFFF" opacity="0.85" />
      <circle cx="62" cy="75" r="0.9" fill="#FFFFFF" opacity="0.9" />

      <!-- Specular Line on Top Ridge -->
      <path d="M 22 68 L 58 48" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />
    </g>
  
</svg>