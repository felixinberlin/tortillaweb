<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="320" height="240" fill="none" role="img" aria-label="Boletus Edulis" class="">


    <defs>
      
    <!-- Master Drop Shadow with Warm Ambient Occlusion -->
    <filter id="mushrooms_svg_dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" floodColor="#1C0A00" floodOpacity="0.38" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#000000" floodOpacity="0.25" />
    </filter>

    <!-- Deep 3D Shadow for Floating Objects -->
    <filter id="mushrooms_svg_deepShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" floodColor="#1A0D00" floodOpacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#000000" floodOpacity="0.3" />
    </filter>

    <!-- Soft Organic Shadow -->
    <filter id="mushrooms_svg_softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3.5" floodColor="#271505" floodOpacity="0.3" />
    </filter>

    <!-- Glossy Specular Highlight Filter -->
    <filter id="mushrooms_svg_glossHighlight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Food Glisten Filter -->
    <filter id="mushrooms_svg_glistenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Organic Natural Texture Filter -->
    <filter id="mushrooms_svg_organicTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.5   0 0 0 0 0.4   0 0 0 0 0.3  0 0 0 0.12 0" />
      <feComposite in2="SourceGraphic" in="gl" operator="in" />
    </filter>
  
      
      <!-- Velvety Chestnut-Brown Boletus Cap Base -->
      <radialGradient id="mushrooms_svg_boletusCap" cx="38%" cy="30%" r="70%">
        <stop offset="0%" stopColor="#A16207" />
        <stop offset="35%" stopColor="#78350F" />
        <stop offset="75%" stopColor="#451A03" />
        <stop offset="100%" stopColor="#1C0A00" />
      </radialGradient>

      <!-- Creamy Spongy Pore Tube Layer (Hymenium) -->
      <linearGradient id="mushrooms_svg_poreLayer" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stopColor="#FEF9C3" />
        <stop offset="60%" stopColor="#EAB308" />
        <stop offset="100%" stopColor="#CA8A04" />
      </linearGradient>

      <!-- Bulbous Clubbed Stipe (Stem) -->
      <radialGradient id="mushrooms_svg_stipeStem" cx="40%" cy="40%" r="60%">
        <stop offset="0%" stopColor="#FFFBEB" />
        <stop offset="50%" stopColor="#FEF3C7" />
        <stop offset="85%" stopColor="#D97706" />
        <stop offset="100%" stopColor="#78350F" />
      </radialGradient>
    </defs>

    <g filter="url(#mushrooms_svg_dropShadow)">
      <!-- 1. Bulbous Thick Stipe (Stem) -->
      <path d="M 38 48 C 36 60 28 72 32 84 C 36 88 64 88 68 84 C 72 72 64 60 62 48 Z" 
            fill="url(#mushrooms_svg_stipeStem)" 
            stroke="#78350F" 
            stroke-width="1.2" />

      <!-- Fine White Reticulation Mesh Network on Stem -->
      <path d="M 38 56 Q 50 54 62 56 M 36 66 Q 50 64 64 66 M 34 76 Q 50 74 66 76" stroke="#FFFFFF" stroke-width="0.8" opacity="0.65" fill="none" />
      <path d="M 44 50 Q 42 70 44 86 M 56 50 Q 58 70 56 86" stroke="#FFFFFF" stroke-width="0.8" opacity="0.65" fill="none" />

      <!-- 2. Spongy Creamy-Yellow Pore Underside Layer -->
      <ellipse cx="50" cy="50" rx="34" ry="10" fill="url(#mushrooms_svg_poreLayer)" stroke="#CA8A04" stroke-width="1" />

      <!-- 3. Velvety Domed Chestnut Cap (Pileus) -->
      <path d="M 16 48 C 14 30 28 16 50 16 C 72 16 86 30 84 48 C 76 52 24 52 16 48 Z" 
            fill="url(#mushrooms_svg_boletusCap)" 
            stroke="#1C0A00" 
            stroke-width="1.2" />

      <!-- 4. Soft Satin Highlight on Dome -->
      <path d="M 32 26 C 40 20 60 20 68 26 C 58 22 42 22 32 28 Z" fill="#FFFFFF" opacity="0.55" filter="url(#mushrooms_svg_glossHighlight)" />
      <ellipse cx="40" cy="28" rx="4" ry="2.2" fill="#FFFFFF" opacity="0.7" transform="rotate(-15 40 28)" />

      <!-- 5. Earth Dust on Stem Base -->
      <ellipse cx="50" cy="85" rx="16" ry="3" fill="#451A03" opacity="0.65" />
    </g>
  
</svg>