<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="320" height="240" fill="none" role="img" aria-label="Patata Monalisa" class="">


    <defs>
      
    <!-- Master Drop Shadow with Warm Ambient Occlusion -->
    <filter id="potato_svg_dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" floodColor="#1C0A00" floodOpacity="0.38" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#000000" floodOpacity="0.25" />
    </filter>

    <!-- Deep 3D Shadow for Floating Objects -->
    <filter id="potato_svg_deepShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" floodColor="#1A0D00" floodOpacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#000000" floodOpacity="0.3" />
    </filter>

    <!-- Soft Organic Shadow -->
    <filter id="potato_svg_softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3.5" floodColor="#271505" floodOpacity="0.3" />
    </filter>

    <!-- Glossy Specular Highlight Filter -->
    <filter id="potato_svg_glossHighlight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Food Glisten Filter -->
    <filter id="potato_svg_glistenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Organic Natural Texture Filter -->
    <filter id="potato_svg_organicTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.5   0 0 0 0 0.4   0 0 0 0 0.3  0 0 0 0.12 0" />
      <feComposite in2="SourceGraphic" in="gl" operator="in" />
    </filter>
  
      
      <!-- Confit Potato Flesh: Translucent Golden Cream Core with Starch Gradient -->
      <radialGradient id="potato_svg_flesh" cx="42%" cy="40%" r="60%">
        <stop offset="0%" stopColor="#FFFBEB" />
        <stop offset="35%" stopColor="#FEF08A" />
        <stop offset="70%" stopColor="#FACC15" />
        <stop offset="90%" stopColor="#EAB308" />
        <stop offset="100%" stopColor="#CA8A04" />
      </radialGradient>

      <!-- Fried Blister Edge Gradient (Maillard) -->
      <linearGradient id="potato_svg_crispEdge" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stopColor="#B45309" />
        <stop offset="50%" stopColor="#78350F" />
        <stop offset="100%" stopColor="#D97706" />
      </linearGradient>

      <radialGradient id="potato_svg_blister" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stopColor="#D97706" />
        <stop offset="80%" stopColor="#78350F" />
        <stop offset="100%" stopColor="#451A03" />
      </radialGradient>
    </defs>

    <g filter="url(#potato_svg_dropShadow)">
      <!-- 1. Potato Slice Outer Disk (Natural Hand-Sliced Wavy Edge) -->
      <path d="M 18 50 C 16 32 30 18 50 16 C 72 14 86 28 85 48 C 84 70 70 86 48 85 C 28 84 19 68 18 50 Z" 
            fill="url(#potato_svg_flesh)" 
            stroke="url(#potato_svg_crispEdge)" 
            stroke-width="2.5" />

      <!-- 2. Crispy Caramelized Toast Blisters on Edges (Fritura / Confit) -->
      <!-- Blister Top-Right -->
      <path d="M 62 18 C 74 20 84 28 85 40 C 78 35 70 26 62 18 Z" fill="url(#potato_svg_blister)" opacity="0.85" />
      
      <!-- Blister Bottom-Left -->
      <path d="M 20 58 C 18 70 28 82 40 85 C 32 78 24 68 20 58 Z" fill="url(#potato_svg_blister)" opacity="0.85" />
      
      <!-- Surface Toast Spots -->
      <ellipse cx="36" cy="38" rx="6" ry="3.5" fill="#B45309" opacity="0.65" transform="rotate(-20 36 38)" />
      <ellipse cx="62" cy="60" rx="8" ry="4" fill="#92400E" opacity="0.6" transform="rotate(30 62 60)" />
      <ellipse cx="46" cy="65" rx="5" ry="2.5" fill="#B45309" opacity="0.5" transform="rotate(-10 46 65)" />

      <!-- 3. Starch Fiber Striations -->
      <path d="M 32 46 C 45 42 60 48 70 44" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8" />
      <path d="M 36 55 C 48 52 58 58 66 54" stroke="#FDE047" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.75" />

      <!-- 4. Glistening Extra Virgin Olive Oil Coat Sheen -->
      <path d="M 32 28 C 42 22 58 24 68 32 C 58 28 44 28 32 34 Z" fill="#FFFFFF" opacity="0.75" filter="url(#potato_svg_glossHighlight)" />
      <ellipse cx="36" cy="30" rx="3.5" ry="1.8" fill="#FFFFFF" opacity="0.9" />
      <circle cx="68" cy="46" r="1.5" fill="#FFFFFF" opacity="0.8" />
      <circle cx="50" cy="50" r="1.2" fill="#FFFFFF" opacity="0.7" />

      <!-- 5. Flakes of Pyramidal Sea Salt -->
      <polygon points="46,38 49,35 52,38 49,41" fill="#FFFFFF" opacity="0.95" />
      <polygon points="56,48 58,46 60,48 58,50" fill="#FFFFFF" opacity="0.9" />
    </g>
  
</svg>