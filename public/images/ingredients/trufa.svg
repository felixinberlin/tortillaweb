<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="320" height="240" fill="none" role="img" aria-label="Trufa Negra" class="">


    <defs>
      
    <!-- Master Drop Shadow with Warm Ambient Occlusion -->
    <filter id="truffle_svg_dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" floodColor="#1C0A00" floodOpacity="0.38" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#000000" floodOpacity="0.25" />
    </filter>

    <!-- Deep 3D Shadow for Floating Objects -->
    <filter id="truffle_svg_deepShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" floodColor="#1A0D00" floodOpacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#000000" floodOpacity="0.3" />
    </filter>

    <!-- Soft Organic Shadow -->
    <filter id="truffle_svg_softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3.5" floodColor="#271505" floodOpacity="0.3" />
    </filter>

    <!-- Glossy Specular Highlight Filter -->
    <filter id="truffle_svg_glossHighlight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Food Glisten Filter -->
    <filter id="truffle_svg_glistenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Organic Natural Texture Filter -->
    <filter id="truffle_svg_organicTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.5   0 0 0 0 0.4   0 0 0 0 0.3  0 0 0 0.12 0" />
      <feComposite in2="SourceGraphic" in="gl" operator="in" />
    </filter>
  
      
      <!-- Charcoal-Sepia Truffle Base -->
      <radialGradient id="truffle_svg_truffleBase" cx="38%" cy="30%" r="68%">
        <stop offset="0%" stopColor="#3F3F46" />
        <stop offset="35%" stopColor="#27272A" />
        <stop offset="70%" stopColor="#18181B" />
        <stop offset="100%" stopColor="#09090B" />
      </radialGradient>

      <!-- 3D Polygonal Pyramid Peridium Wart Shading -->
      <linearGradient id="truffle_svg_wartTop" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stopColor="#52525B" />
        <stop offset="100%" stopColor="#27272A" />
      </linearGradient>
    </defs>

    <g filter="url(#truffle_svg_deepShadow)">
      <!-- 1. Organic Rounded Truffle Tuber Lump -->
      <path d="M 22 55 C 16 38 28 20 52 18 C 74 16 86 32 84 55 C 82 76 72 86 48 86 C 26 86 18 72 22 55 Z" 
            fill="url(#truffle_svg_truffleBase)" 
            stroke="#09090B" 
            stroke-width="1.5" />

      <!-- 2. Faceted Polygonal Warts (Peridium) -->
      <!-- Center Cluster -->
      <polygon points="42,32 50,26 58,32 54,40 44,40" fill="url(#truffle_svg_wartTop)" stroke="#09090B" stroke-width="0.8" />
      <polygon points="58,32 68,28 72,36 66,44 54,40" fill="#27272A" stroke="#09090B" stroke-width="0.8" />
      <polygon points="32,42 42,32 44,40 38,50 28,48" fill="#3F3F46" stroke="#09090B" stroke-width="0.8" />
      <polygon points="44,40 54,40 56,52 46,54 38,50" fill="url(#truffle_svg_wartTop)" stroke="#09090B" stroke-width="0.8" />
      <polygon points="54,40 66,44 68,54 56,52" fill="#18181B" stroke="#09090B" stroke-width="0.8" />
      <polygon points="46,54 56,52 54,66 42,66 38,58" fill="#27272A" stroke="#09090B" stroke-width="0.8" />
      <polygon points="30,58 38,58 42,66 36,74 26,70" fill="#18181B" stroke="#09090B" stroke-width="0.8" />
      <polygon points="56,52 68,54 70,66 58,68 54,66" fill="#09090B" stroke="#18181B" stroke-width="0.8" />

      <!-- 3. Earth & Clay Soil Dust in Crevices -->
      <circle cx="43" cy="39" r="1.2" fill="#78350F" opacity="0.65" />
      <circle cx="55" cy="51" r="1.4" fill="#78350F" opacity="0.6" />
      <circle cx="37" cy="57" r="1" fill="#78350F" opacity="0.7" />
      <circle cx="67" cy="43" r="1.1" fill="#78350F" opacity="0.55" />

      <!-- 4. Subtle Diffuse Highlight on Upper Warts -->
      <polygon points="48,27 52,27 54,30 49,30" fill="#FFFFFF" opacity="0.4" />
      <polygon points="38,33 42,33 43,36 39,36" fill="#FFFFFF" opacity="0.35" />
    </g>
  
</svg>