<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="320" height="240" fill="none" role="img" aria-label="Garbanzo de Fuentesaúco (1798)" class="">


    <defs>
      
    <!-- Master Drop Shadow with Warm Ambient Occlusion -->
    <filter id="chickpea_svg_dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" floodColor="#1C0A00" floodOpacity="0.38" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#000000" floodOpacity="0.25" />
    </filter>

    <!-- Deep 3D Shadow for Floating Objects -->
    <filter id="chickpea_svg_deepShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" floodColor="#1A0D00" floodOpacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#000000" floodOpacity="0.3" />
    </filter>

    <!-- Soft Organic Shadow -->
    <filter id="chickpea_svg_softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3.5" floodColor="#271505" floodOpacity="0.3" />
    </filter>

    <!-- Glossy Specular Highlight Filter -->
    <filter id="chickpea_svg_glossHighlight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Food Glisten Filter -->
    <filter id="chickpea_svg_glistenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Organic Natural Texture Filter -->
    <filter id="chickpea_svg_organicTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.5   0 0 0 0 0.4   0 0 0 0 0.3  0 0 0 0.12 0" />
      <feComposite in2="SourceGraphic" in="gl" operator="in" />
    </filter>
  
      
      <!-- Buttery-Sand Chickpea Skin Gradient -->
      <radialGradient id="chickpea_svg_chickpeaBase" cx="36%" cy="30%" r="70%">
        <stop offset="0%" stopColor="#FFFBEB" />
        <stop offset="30%" stopColor="#FEF3C7" />
        <stop offset="65%" stopColor="#FDE68A" />
        <stop offset="90%" stopColor="#D97706" />
        <stop offset="100%" stopColor="#92400E" />
      </radialGradient>

      <!-- Rugose Skin Crease Tone -->
      <linearGradient id="chickpea_svg_creaseTone" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stopColor="#B45309" />
        <stop offset="100%" stopColor="#78350F" />
      </linearGradient>
    </defs>

    <g filter="url(#chickpea_svg_dropShadow)">
      <!-- 1. Main Botanical Chickpea Shape with Signature Curved Beak (Pico de Garbanzo) -->
      <path d="M 46 16 C 42 16 38 20 40 26 C 24 32 20 52 22 68 C 24 82 38 88 54 88 C 72 88 82 76 82 58 C 82 40 72 26 56 22 C 54 18 50 16 46 16 Z" 
            fill="url(#chickpea_svg_chickpeaBase)" 
            stroke="#92400E" 
            stroke-width="1.2" />

      <!-- 2. Characteristic Median Groove (Surco del Garbanzo) -->
      <path d="M 42 26 C 44 38 46 56 46 86" stroke="url(#chickpea_svg_creaseTone)" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 44 40 C 34 50 32 64 34 78" stroke="#D97706" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6" />

      <!-- 3. Soft Matte Diffuse Highlight on Cheek -->
      <path d="M 52 32 C 62 30 72 36 72 48 C 66 42 58 40 52 38 Z" fill="#FFFFFF" opacity="0.65" filter="url(#chickpea_svg_glossHighlight)" />
      <ellipse cx="58" cy="40" rx="3" ry="5" fill="#FFFFFF" opacity="0.5" transform="rotate(15 58 40)" />

      <!-- 4. Subtle Earth Starch Pores -->
      <circle cx="34" cy="54" r="0.7" fill="#78350F" opacity="0.5" />
      <circle cx="68" cy="62" r="0.8" fill="#78350F" opacity="0.45" />
      <circle cx="56" cy="74" r="0.6" fill="#78350F" opacity="0.5" />
    </g>
  
</svg>