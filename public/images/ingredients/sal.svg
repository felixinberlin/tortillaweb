<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="320" height="240" fill="none" role="img" aria-label="Flor de Sal Marina" class="">


    <defs>
      
    <!-- Master Drop Shadow with Warm Ambient Occlusion -->
    <filter id="salt_svg_dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" floodColor="#1C0A00" floodOpacity="0.38" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#000000" floodOpacity="0.25" />
    </filter>

    <!-- Deep 3D Shadow for Floating Objects -->
    <filter id="salt_svg_deepShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" floodColor="#1A0D00" floodOpacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#000000" floodOpacity="0.3" />
    </filter>

    <!-- Soft Organic Shadow -->
    <filter id="salt_svg_softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3.5" floodColor="#271505" floodOpacity="0.3" />
    </filter>

    <!-- Glossy Specular Highlight Filter -->
    <filter id="salt_svg_glossHighlight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Food Glisten Filter -->
    <filter id="salt_svg_glistenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Organic Natural Texture Filter -->
    <filter id="salt_svg_organicTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.5   0 0 0 0 0.4   0 0 0 0 0.3  0 0 0 0.12 0" />
      <feComposite in2="SourceGraphic" in="gl" operator="in" />
    </filter>
  
      
      <!-- Translucent Prismatic Sea Salt Gradient -->
      <linearGradient id="salt_svg_facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stopColor="#FFFFFF" />
        <stop offset="100%" stopColor="#E2E8F0" />
      </linearGradient>

      <linearGradient id="salt_svg_facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stopColor="#CBD5E1" />
        <stop offset="100%" stopColor="#94A3B8" />
      </linearGradient>

      <linearGradient id="salt_svg_facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stopColor="#F8FAFC" />
        <stop offset="100%" stopColor="#CBD5E1" />
      </linearGradient>
    </defs>

    <g filter="url(#salt_svg_dropShadow)">
      <!-- Master 3D Pyramidal Crystal of Flor de Sal (Añana / Es Trenc) -->
      <!-- Center Pyramid -->
      <g transform="translate(4, 2)">
        <polygon points="46,18 72,42 46,58 20,42" fill="url(#salt_svg_facetTop)" stroke="#FFFFFF" stroke-width="0.8" />
        <polygon points="20,42 46,58 46,84 20,68" fill="url(#salt_svg_facetLeft)" stroke="#94A3B8" stroke-width="0.8" />
        <polygon points="46,58 72,42 72,68 46,84" fill="url(#salt_svg_facetRight)" stroke="#CBD5E1" stroke-width="0.8" />
        
        <!-- Diamond Specular Light Glint on Peak -->
        <circle cx="46" cy="18" r="3" fill="#FFFFFF" filter="url(#salt_svg_glossHighlight)" />
        <polygon points="46,13 47.5,18 52,18 48,20 50,24 46,21 42,24 44,20 40,18 44.5,18" fill="#FFFFFF" />
      </g>

      <!-- Smaller Secondary Flake 1 (Left) -->
      <g transform="translate(-16, 20) scale(0.6)">
        <polygon points="46,22 68,42 46,58 24,42" fill="url(#salt_svg_facetTop)" />
        <polygon points="24,42 46,58 46,78 24,62" fill="url(#salt_svg_facetLeft)" />
        <polygon points="46,58 68,42 68,62 46,78" fill="url(#salt_svg_facetRight)" />
        <circle cx="46" cy="22" r="2" fill="#FFFFFF" />
      </g>

      <!-- Smaller Secondary Flake 2 (Right) -->
      <g transform="translate(38, 26) scale(0.55)">
        <polygon points="46,22 68,42 46,58 24,42" fill="url(#salt_svg_facetTop)" />
        <polygon points="24,42 46,58 46,78 24,62" fill="url(#salt_svg_facetLeft)" />
        <polygon points="46,58 68,42 68,62 46,78" fill="url(#salt_svg_facetRight)" />
      </g>

      <!-- Scattered Micro Sea Salt Grains -->
      <polygon points="26,76 28,74 30,76 28,78" fill="#FFFFFF" />
      <polygon points="70,78 72,76 74,78 72,80" fill="#FFFFFF" />
      <polygon points="56,86 58,84 60,86 58,88" fill="#FFFFFF" />
      <polygon points="38,24 39,23 40,24 39,25" fill="#FFFFFF" />
    </g>
  
</svg>