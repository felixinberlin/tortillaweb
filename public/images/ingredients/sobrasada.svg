<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="320" height="240" fill="none" role="img" aria-label="Sobrasada de Mallorca" class="">


    <defs>
      
    <!-- Master Drop Shadow with Warm Ambient Occlusion -->
    <filter id="sobrasada_svg_dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" floodColor="#1C0A00" floodOpacity="0.38" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#000000" floodOpacity="0.25" />
    </filter>

    <!-- Deep 3D Shadow for Floating Objects -->
    <filter id="sobrasada_svg_deepShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" floodColor="#1A0D00" floodOpacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#000000" floodOpacity="0.3" />
    </filter>

    <!-- Soft Organic Shadow -->
    <filter id="sobrasada_svg_softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3.5" floodColor="#271505" floodOpacity="0.3" />
    </filter>

    <!-- Glossy Specular Highlight Filter -->
    <filter id="sobrasada_svg_glossHighlight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Food Glisten Filter -->
    <filter id="sobrasada_svg_glistenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Organic Natural Texture Filter -->
    <filter id="sobrasada_svg_organicTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.5   0 0 0 0 0.4   0 0 0 0 0.3  0 0 0 0.12 0" />
      <feComposite in2="SourceGraphic" in="gl" operator="in" />
    </filter>
  
      
      <!-- Paprika-Orange Pork Paste Gradient -->
      <radialGradient id="sobrasada_svg_sobrasadaBase" cx="40%" cy="35%" r="65%">
        <stop offset="0%" stopColor="#FB923C" />
        <stop offset="35%" stopColor="#F97316" />
        <stop offset="70%" stopColor="#EA580C" />
        <stop offset="90%" stopColor="#C2410C" />
        <stop offset="100%" stopColor="#7C2D12" />
      </radialGradient>

      <!-- Glistening Oleic Fat Sheen -->
      <linearGradient id="sobrasada_svg_fatGlisten" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stopColor="#FEF08A" stopOpacity="0.9" />
        <stop offset="50%" stopColor="#FBBF24" stopOpacity="0.6" />
        <stop offset="100%" stopColor="#EA580C" stopOpacity="0" />
      </linearGradient>
    </defs>

    <g filter="url(#sobrasada_svg_dropShadow)">
      <!-- 1. Artisanal Textured Smear of Sobrasada -->
      <path d="M 18 56 C 14 38 32 24 55 24 C 76 24 86 38 84 58 C 82 76 62 84 38 82 C 22 80 20 68 18 56 Z" 
            fill="url(#sobrasada_svg_sobrasadaBase)" 
            stroke="#7C2D12" 
            stroke-width="1.5" />

      <!-- 2. Coarse Iberian Fat Specks Interspersed in Paste -->
      <ellipse cx="36" cy="42" rx="4" ry="2.5" fill="#FEF3C7" opacity="0.9" transform="rotate(-15 36 42)" />
      <ellipse cx="62" cy="46" rx="5" ry="3" fill="#FEF3C7" opacity="0.9" transform="rotate(20 62 46)" />
      <ellipse cx="48" cy="62" rx="4.5" ry="2.5" fill="#FEF3C7" opacity="0.85" transform="rotate(-5 48 62)" />
      <circle cx="28" cy="58" r="2" fill="#FEF3C7" opacity="0.9" />
      <circle cx="68" cy="64" r="2.2" fill="#FEF3C7" opacity="0.85" />

      <!-- 3. Pimentón de Tap de Cortí Crimson Specks -->
      <circle cx="44" cy="36" r="1.1" fill="#450A0A" />
      <circle cx="56" cy="38" r="1" fill="#450A0A" />
      <circle cx="38" cy="52" r="0.9" fill="#450A0A" />
      <circle cx="54" cy="54" r="1.2" fill="#450A0A" />

      <!-- 4. Glistening Oleic Honeyed Fat Droplets (Warm melting spread) -->
      <path d="M 32 32 C 45 26 62 28 72 36 C 60 32 44 32 32 38 Z" fill="url(#sobrasada_svg_fatGlisten)" filter="url(#sobrasada_svg_glossHighlight)" />
      <ellipse cx="42" cy="34" rx="3.5" ry="1.5" fill="#FFFFFF" opacity="0.8" />
      <circle cx="60" cy="52" r="1.8" fill="#FFFFFF" opacity="0.75" />
    </g>
  
</svg>