<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none" role="img" aria-label="Tortilla con Queso Azul">

  <defs>
    

    <!-- Multi-Layer Heavy Pan Drop Shadow with Ambient Occlusion -->
    <filter id="quesoazul_panShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" floodColor="#0A0500" floodOpacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="5" floodColor="#000000" floodOpacity="0.45" />
    </filter>

    <!-- Food Gloss Highlight -->
    <filter id="quesoazul_foodGloss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Molten Core Liquid Glow -->
    <filter id="quesoazul_lavaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cast Iron Outer Flange & Rim Gradients -->
    <radialGradient id="quesoazul_ironFlange" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stopColor="#44403C" />
      <stop offset="45%" stopColor="#292524" />
      <stop offset="85%" stopColor="#1C1917" />
      <stop offset="100%" stopColor="#0C0A09" />
    </radialGradient>

    <linearGradient id="quesoazul_ironRimBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#78716C" />
      <stop offset="25%" stopColor="#44403C" />
      <stop offset="70%" stopColor="#1C1917" />
      <stop offset="100%" stopColor="#292524" />
    </linearGradient>

    <!-- Beechwood Pan Handle with Brass & Rivets -->
    <linearGradient id="quesoazul_woodHandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#A16207" />
      <stop offset="35%" stopColor="#78350F" />
      <stop offset="70%" stopColor="#451A03" />
      <stop offset="100%" stopColor="#1C0A00" />
    </linearGradient>

    <!-- Master Golden Tortilla Custard Surface Base -->
    <radialGradient id="quesoazul_tortillaBase" cx="44%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#FEF08A" />
      <stop offset="45%" stopColor="#FACC15" />
      <stop offset="82%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#92400E" />
    </radialGradient>

    <!-- Maillard Browning Spots -->
    <radialGradient id="quesoazul_toastedSpot" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#D97706" stopOpacity="0.85" />
      <stop offset="60%" stopColor="#92400E" stopOpacity="0.75" />
      <stop offset="100%" stopColor="#451A03" stopOpacity="0" />
    </radialGradient>

    <!-- Molten Runny Yolk Center Pool (Betanzos / Liquid) -->
    <radialGradient id="quesoazul_runnyPool" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#FFFDE7" />
      <stop offset="20%" stopColor="#FFC800" />
      <stop offset="65%" stopColor="#FF8A00" />
      <stop offset="90%" stopColor="#E65100" />
      <stop offset="100%" stopColor="#B45309" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="400" fill="#1C1917" />

  <!-- Wooden Kitchen Prep Board -->
  
  <g filter="url(#quesoazul_panShadow)">
    <rect x="20" y="20" width="560" height="360" rx="20" fill="#2A1810" stroke="#4A2818" stroke-width="3" />
    <!-- End-Grain Wood Texture Lines -->
    <path d="M 60 20 L 60 380 M 140 20 L 140 380 M 220 20 L 220 380 M 300 20 L 300 380 M 380 20 L 380 380 M 460 20 L 460 380 M 540 20 L 540 380" stroke="#4A2818" stroke-width="1.5" opacity="0.35" />
  </g>
  

  <!-- Outer Skillet Group (with 3D Flip animation support) -->
  <g class="">

  <!-- Skillet Handle (Heavy Forged Iron Shank + Turned Beechwood Grip) -->
  <g filter="url(#quesoazul_panShadow)">
    <!-- Forged Iron Shank Connector -->
    <path d="M 370 188 L 430 184 L 430 216 L 370 212 Z" fill="#1C1917" stroke="#44403C" stroke-width="1.5" />
    <circle cx="395" cy="194" r="3" fill="#57534E" />
    <circle cx="395" cy="206" r="3" fill="#57534E" />

    <!-- Turned Wooden Grip -->
    <path d="M 425 182 L 558 172 C 572 172 578 185 578 200 C 578 215 572 228 558 228 L 425 218 Z" fill="url(#quesoazul_woodHandle)" stroke="#1C0A00" stroke-width="1.5" />
    <!-- Woodgrain Luster Highlights -->
    <path d="M 435 186 C 475 180 525 180 555 184" stroke="#D97706" stroke-width="1.2" fill="none" opacity="0.75" />
    <!-- Hanging Ring Eyelet at Handle Tip -->
    <circle cx="550" cy="200" r="7.5" fill="#0C0A09" stroke="#78716C" stroke-width="1.5" />
    <circle cx="550" cy="200" r="4.5" fill="#2A1810" />
  </g>

  <!-- Heavy Cast Iron Skillet Body -->
  <g filter="url(#quesoazul_panShadow)">
    <!-- Outer Iron Flange Rim -->
    <circle cx="260" cy="200" r="148" fill="url(#quesoazul_ironRimBevel)" stroke="#0C0A09" stroke-width="2" />
    <circle cx="260" cy="200" r="142" fill="url(#quesoazul_ironFlange)" />
    <!-- Deep Pan Inner Wall Shadow Ring -->
    <circle cx="260" cy="200" r="132" fill="#0C0A09" />
    <circle cx="260" cy="200" r="128" fill="#1C1917" stroke="#44403C" stroke-width="1" />
  </g>

  <!-- ==================== TORTILLA SURFACE ==================== -->
  <g>
    <!-- Organic Natural Swollen Edge Tucking into the Pan (Slightly irregular) -->
    <path d="M 260 74 C 330 73 386 130 386 200 C 386 270 330 326 260 326 C 190 326 134 270 134 200 C 134 130 190 75 260 74 Z" 
          fill="url(#quesoazul_tortillaBase)" />

    <!-- Cooked Egg Crust Maillard Browning Zones & Toasted Blisters -->
    <ellipse cx="225" cy="165" rx="55" ry="36" fill="url(#quesoazul_toastedSpot)" transform="rotate(-15 225 165)" />
    <ellipse cx="305" cy="235" rx="58" ry="38" fill="url(#quesoazul_toastedSpot)" transform="rotate(25 305 235)" />
    <ellipse cx="205" cy="245" rx="42" ry="26" fill="url(#quesoazul_toastedSpot)" transform="rotate(-30 205 245)" />
    <ellipse cx="310" cy="150" rx="38" ry="24" fill="url(#quesoazul_toastedSpot)" transform="rotate(10 310 150)" />

    <!-- Edge Caramelization Ring (Where egg touches sizzling cast iron) -->
    <path d="M 142 170 C 135 210 148 265 190 300 C 235 330 295 325 340 295 C 380 260 388 200 375 160" 
          stroke="#78350F" 
          stroke-width="5" 
          fill="none" 
          opacity="0.6" 
          stroke-linecap="round" />

    <!-- POTATO LAYER BASED ON CUT STYLE -->
    
  <g id="quesoazul_panadera">
    <!-- Slice 1 (Top Left) -->
    <ellipse cx="210" cy="160" rx="32" ry="20" fill="#FEF08A" stroke="#D97706" stroke-width="2" transform="rotate(-20 210 160)" />
    <ellipse cx="210" cy="160" rx="24" ry="14" fill="#FFFBEB" opacity="0.8" transform="rotate(-20 210 160)" />
    <ellipse cx="198" cy="155" rx="8" ry="4" fill="#B45309" opacity="0.6" />

    <!-- Slice 2 (Top Right) -->
    <ellipse cx="295" cy="152" rx="30" ry="18" fill="#FDE047" stroke="#D97706" stroke-width="2" transform="rotate(15 295 152)" />
    <ellipse cx="295" cy="152" rx="22" ry="12" fill="#FFFBEB" opacity="0.8" transform="rotate(15 295 152)" />
    <ellipse cx="308" cy="148" rx="7" ry="3.5" fill="#B45309" opacity="0.6" />

    <!-- Slice 3 (Left Mid) -->
    <ellipse cx="192" cy="218" rx="34" ry="21" fill="#FEF08A" stroke="#CA8A04" stroke-width="2" transform="rotate(35 192 218)" />
    <ellipse cx="192" cy="218" rx="26" ry="15" fill="#FFFBEB" opacity="0.8" transform="rotate(35 192 218)" />

    <!-- Slice 4 (Right Mid) -->
    <ellipse cx="312" cy="212" rx="30" ry="19" fill="#FEF08A" stroke="#D97706" stroke-width="2" transform="rotate(-10 312 212)" />
    <ellipse cx="312" cy="212" rx="22" ry="13" fill="#FFFBEB" opacity="0.8" transform="rotate(-10 312 212)" />

    <!-- Slice 5 (Bottom) -->
    <ellipse cx="252" cy="252" rx="32" ry="19" fill="#FDE047" stroke="#CA8A04" stroke-width="2" transform="rotate(5 252 252)" />
    <ellipse cx="252" cy="252" rx="24" ry="13" fill="#FFFBEB" opacity="0.8" transform="rotate(5 252 252)" />
  </g>
  

    <!-- CARAMELIZED ONION STRANDS -->
    

    <!-- EXTRA TOPPINGS (Chorizo, Jamón, Truffle, etc.) -->
    
      <g id="quesoazul_extra_cheese">
        <ellipse cx="225" cy="180" rx="14" ry="7" fill="#FEF9C3" stroke="#FDE047" stroke-width="1.5" opacity="0.9" />
        <ellipse cx="298" cy="225" rx="16" ry="8" fill="#FEF08A" stroke="#CA8A04" stroke-width="1" opacity="0.92" />
        <path d="M 285 228 Q 302 235 315 225" stroke="#B45309" stroke-width="1.2" fill="none" opacity="0.7" />
      </g>
    

    <!-- DONENESS CENTER DOME / RUNNY LAVA -->
    
    <!-- Creamy Custardy / Melosa Golden Center -->
    <g>
      <ellipse cx="252" cy="192" rx="34" ry="26" fill="#FACC15" opacity="0.9" />
      <ellipse cx="252" cy="192" rx="24" ry="18" fill="#FEF08A" opacity="0.8" />
      <path class="" d="M 238 184 C 248 178 262 180 268 188" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75" />
    </g>
    

    <!-- Sizzling Extra Virgin Olive Oil Glistening Droplets -->
    <g class="">
      <circle cx="180" cy="165" r="3.5" fill="#84CC16" opacity="0.9" />
      <circle cx="180" cy="165" r="1.5" fill="#FFFFFF" />
      <circle cx="330" cy="175" r="4" fill="#EAB308" opacity="0.9" />
      <circle cx="330" cy="175" r="1.5" fill="#FFFFFF" />
    </g>
    <g class="">
      <circle cx="265" cy="255" r="3" fill="#84CC16" opacity="0.9" />
      <circle cx="218" cy="130" r="3.5" fill="#EAB308" opacity="0.9" />
      <circle cx="312" cy="245" r="2.5" fill="#84CC16" opacity="0.9" />
    </g>

    <!-- Flakes of Pyramidal Flor de Sal Scattered on Top -->
    <polygon points="215,185 218,182 221,185 218,188" fill="#FFFFFF" opacity="0.95" />
    <polygon points="295,160 298,157 301,160 298,163" fill="#FFFFFF" opacity="0.95" />
    <polygon points="275,235 278,232 281,235 278,238" fill="#FFFFFF" opacity="0.9" />
    <polygon points="230,225 232,223 234,225 232,227" fill="#FFFFFF" opacity="0.9" />

    <!-- Sizzling Aromatic Steam Wafts -->
    <g>
      <path class="" d="M 225 110 Q 215 85 232 65" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.3" filter="url(#quesoazul_foodGloss)" />
      <path class="" d="M 265 105 Q 282 80 268 55" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.35" filter="url(#quesoazul_foodGloss)" />
      <path class="" d="M 300 115 Q 312 90 296 70" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.25" filter="url(#quesoazul_foodGloss)" />
    </g>
  </g>

  </g> <!-- End of Skillet Flip Group -->

  <!-- BADGE AND OVERLAY INFO -->
  
  <g id="quesoazul_badge" filter="url(#quesoazul_panShadow)">
    <rect x="35" y="322" width="450" height="46" rx="12" fill="#F5E6BE" stroke="#8D6E63" stroke-width="2" />
    <rect x="39" y="326" width="442" height="38" rx="10" fill="#FAF4E8" stroke="#D7CCC8" stroke-width="1" />

    <text x="52" y="348" fill="#3E2723" font-size="14" font-weight="bold" font-family="Georgia, serif">
      Tortilla con Queso Azul
    </text>

    <text x="52" y="360" fill="#8D6E63" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">
      MELOSA • PANADERA • 6 HUEVOS (100g/h)
    </text>

    
  </g>
  
  
</svg>