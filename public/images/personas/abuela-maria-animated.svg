<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none" role="img" aria-labelledby="abuela_title">
  <title id="abuela_title">Abuela María - Animación Tradicional</title>
  <defs>
    <radialGradient id="abuelaBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="65%" stop-color="#F5E6BE" />
      <stop offset="100%" stop-color="#E6CF9B" />
    </radialGradient>
    <radialGradient id="cheekBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="apronGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1E5C9" />
    </linearGradient>
  </defs>

  <style>
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
    }
    @keyframes talk {
      0%, 100% { transform: scaleY(0.35) scaleX(0.9); }
      20% { transform: scaleY(1.3) scaleX(1.15) translateY(2px); }
      45% { transform: scaleY(0.6) scaleX(1.0); }
      70% { transform: scaleY(1.4) scaleX(1.1) translateY(2px); }
    }
    @keyframes breathe {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-1.5px) rotate(0.5deg); }
    }
    .head {
      transform-origin: 100px 140px;
      animation: breathe 3.5s infinite ease-in-out;
    }
    .eye-left {
      transform-origin: 83px 95px;
      animation: blink 4s infinite ease-in-out;
    }
    .eye-right {
      transform-origin: 117px 95px;
      animation: blink 4s infinite ease-in-out;
    }
    .mouth {
      transform-origin: 100px 124px;
      animation: talk 0.35s infinite ease-in-out;
    }
  </style>

  <!-- Outer Ring / Gold Border -->
  <circle cx="100" cy="100" r="95" fill="url(#abuelaBg)" stroke="#FFB800" stroke-width="4" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="#EADBB6" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Animated Head & Body -->
  <g class="head">
    <!-- Dress / Body -->
    <path d="M 44 200 C 44 158 66 150 100 150 C 134 150 156 158 156 200 Z" fill="#3E2C22" />

    <!-- Traditional Kitchen Apron (Delantal del Baztán) -->
    <path d="M 66 156 L 134 156 L 144 200 L 56 200 Z" fill="url(#apronGrad)" stroke="#8D6E63" stroke-width="1.5" />

    <!-- Apron Straps & Collar Lace -->
    <path d="M 80 150 L 72 170 M 120 150 L 128 170" stroke="#8D6E63" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 84 150 Q 100 162 116 150" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

    <!-- Heart Brooch on Apron -->
    <path d="M 100 167 C 98 163 93 163 93 166 C 93 170 100 174 100 174 C 100 174 107 170 107 166 C 107 163 102 163 100 167 Z" fill="#E11D48" />

    <!-- Neck -->
    <rect x="91" y="130" width="18" height="25" rx="5" fill="#FBD5B5" />

    <!-- High Hair Bun (Moño tradicional) -->
    <circle cx="100" cy="42" r="24" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2.5" />
    <path d="M 87 40 Q 100 30 113 40 M 89 48 Q 100 38 111 48 M 94 34 Q 100 28 106 34" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 78 36 L 122 36" stroke="#B45309" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="78" cy="36" r="3" fill="#D97706" />

    <!-- Ears & Pearl Earrings -->
    <ellipse cx="61" cy="98" rx="6" ry="10" fill="#FBD5B5" stroke="#F6AD7B" stroke-width="1" />
    <circle cx="61" cy="104" r="2.8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <ellipse cx="139" cy="98" rx="6" ry="10" fill="#FBD5B5" stroke="#F6AD7B" stroke-width="1" />
    <circle cx="139" cy="104" r="2.8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />

    <!-- Face Base -->
    <ellipse cx="100" cy="98" rx="40" ry="43" fill="#FDE1C9" />

    <!-- Rosy Smiling Cheeks -->
    <ellipse cx="76" cy="109" rx="11" ry="8" fill="url(#cheekBlush)" />
    <ellipse cx="124" cy="109" rx="11" ry="8" fill="url(#cheekBlush)" />

    <!-- Hair Front & Bangs -->
    <path d="M 61 88 C 61 58 76 50 100 50 C 124 50 139 58 139 88 C 133 70 120 62 100 66 C 80 62 67 70 61 88 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M 100 66 C 96 74 88 80 80 84 M 100 66 C 104 74 112 80 120 84" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arched Eyebrows -->
    <path d="M 72 82 Q 83 75 92 80" fill="none" stroke="#94A3B8" stroke-width="2.8" stroke-linecap="round" />
    <path d="M 108 80 Q 117 75 128 82" fill="none" stroke="#94A3B8" stroke-width="2.8" stroke-linecap="round" />

    <!-- Glasses (Gafitas redondas doradas) -->
    <path d="M 94 94 Q 100 90 106 94" fill="none" stroke="#D97706" stroke-width="2.2" />
    <circle cx="83" cy="95" r="14" fill="#FFFFFF" fill-opacity="0.3" stroke="#D97706" stroke-width="2.2" />
    <path d="M 76 88 Q 80 86 86 87" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    <circle cx="117" cy="95" r="14" fill="#FFFFFF" fill-opacity="0.3" stroke="#D97706" stroke-width="2.2" />
    <path d="M 110 88 Q 114 86 120 87" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

    <!-- Eyes (Animated Blinking) -->
    <g class="eye-left">
      <circle cx="83" cy="95" r="4.2" fill="#3E2723" />
      <circle cx="84.5" cy="93.5" r="1.6" fill="#FFFFFF" />
      <path d="M 70 94 Q 72 96 74 98" fill="none" stroke="#F6AD7B" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <g class="eye-right">
      <circle cx="117" cy="95" r="4.2" fill="#3E2723" />
      <circle cx="118.5" cy="93.5" r="1.6" fill="#FFFFFF" />
      <path d="M 130 94 Q 128 96 126 98" fill="none" stroke="#F6AD7B" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Nose -->
    <path d="M 97 97 Q 100 107 104 105" fill="none" stroke="#E08B5D" stroke-width="2.2" stroke-linecap="round" />

    <!-- Mouth (Animated Talking & Smiling) -->
    <g class="mouth">
      <path d="M 88 121 Q 100 134 112 121 Q 100 126 88 121 Z" fill="#9F1239" stroke="#881337" stroke-width="1.5" />
      <path d="M 92 122 Q 100 125 108 122" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <ellipse cx="100" cy="127" rx="5" ry="3" fill="#FB7185" />
      <path d="M 86 119 Q 87 122 89 124" fill="none" stroke="#E08B5D" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 114 119 Q 113 122 111 124" fill="none" stroke="#E08B5D" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
